# .github/workflows/pr-review.yml
# 周期 7 P1-7: PR review automation（claude-code-action / open-code-review）
#
# 触发条件：
#   - pull_request 打开 / 同步 / 重开
#   - workflow_dispatch 手动触发
#
# 工作流：
#   1. checkout 代码
#   2. 跑 checkpoint（确保基础 9 项健康）
#   3. 跑 AI 工具探针（确保 AI 端点无 5xx）
#   4. 调用 AI Action 评审（claude-code-action @v1 或 open-code-review）
#   5. 输出 PR 评审评论
#
# 权限：
#   - contents: read
#   - pull-requests: write（评论）
#   - id-token: write（OIDC for OTel 等）
#
# 注意事项：
#   - 周期 7 仅静态扫描 + 评估，不真正跑 AI 评审（避免 token 消耗）
#   - 周期 8+ 接入实际 AI 评审（需要 ANTHROPIC_API_KEY / OPENAI_API_KEY）
#   - 仅 /api/* 不应被 PR workflow 触发（GitHub Actions 不在 3001）

name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  baseline:
    name: 基础健康检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run checkpoint
        run: node tests/checkpoint.cjs --report-only
      - name: Run AI tool probe
        run: node tests/probe-real-ai-tool-first.cjs
      - name: Run all specs (summary)
        run: |
          set -e
          PASS=0
          FAIL=0
          for spec in tests/specs/*.cjs; do
            name=$(basename "$spec" .cjs)
            if node "$spec" > /tmp/spec-$name.log 2>&1; then
              echo "✓ $name"
              PASS=$((PASS+1))
            else
              echo "✗ $name"
              FAIL=$((FAIL+1))
            fi
          done
          echo "specs: pass=$PASS fail=$FAIL"
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

  ai-review:
    name: AI PR Review
    needs: baseline
    runs-on: ubuntu-latest
    # 周期 7 仅做占位；周期 8+ 接入 claude-code-action 或 open-code-review
    # 必要 secrets: ANTHROPIC_API_KEY 或 OPENAI_API_KEY
    steps:
      - uses: actions/checkout@v4
      - name: AI Review placeholder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #$PR_NUMBER 评审占位"
          echo "周期 7 仅静态扫描 + 评估；周期 8+ 接入 AI Action"
          echo "推荐 Action: anthropics/claude-code-action@v1 或 openai/open-code-review@v1"
          # 周期 8+ 实际接入：
          # - name: Claude Code Review
          #   uses: anthropics/claude-code-action@v1
          #   with:
          #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          #     prompt: |
          #       Review this PR for:
          #       1. Security issues (SSRF, XSS, auth bypass)
          #       2. Spec coverage (each new feature has tests/specs/*.cjs)
          #       3. Commit format (feat/fix(chore)(cycle-NN): ...)
          #       4. No .env / real keys / blog.db committed
          #       5. Cycle docs in docs/cycles/cycle-NN-*.md

      - name: Post PR comment (placeholder)
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## PR Review (周期 7 P1-7 占位)
            - ✅ 基础健康检查通过
            - ⏳ AI 评审（周期 8+ 接入）
            - 评审项：security / spec coverage / commit format / cycle docs
