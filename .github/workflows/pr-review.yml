# .github/workflows/pr-review.yml
# 周期 7 P1-7: PR review automation（claude-code-action / open-code-review）
# 周期 9 P1-4: 接 MiniMax-M3 跑 PR review（anthropic-base-url + model: MiniMax-M3）
#
# 触发条件：
#   - pull_request 打开 / 同步 / 重开
#   - workflow_dispatch 手动触发
#
# 工作流：
#   1. checkout 代码
#   2. 跑 checkpoint（确保基础 9 项健康）
#   3. 跑 AI 工具探针（确保 AI 端点无 5xx）
#   4. 调用 claude-code-action 接 MiniMax-M3 跑 PR 评审
#   5. 输出 PR 评审评论
#
# 权限：
#   - contents: read
#   - pull-requests: write（评论）
#   - id-token: write（OIDC for OTel 等）
#
# 周期 9 注意事项：
#   - claude-code-action 通过 anthropic-base-url 指向 MiniMax-M3（Anthropic-compatible API）
#   - secrets.M3_API_KEY 必要（MiniMax 平台 API key）
#   - claude_args 强制 claude --model MiniMax-M3 --max-turns 5

name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  baseline:
    name: 基础健康检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run checkpoint
        run: node tests/checkpoint.cjs --report-only
      - name: Run AI tool probe
        run: node tests/probe-real-ai-tool-first.cjs
      - name: Run all specs (summary)
        run: |
          set -e
          PASS=0
          FAIL=0
          for spec in tests/specs/*.cjs; do
            name=$(basename "$spec" .cjs)
            if node "$spec" > /tmp/spec-$name.log 2>&1; then
              echo "✓ $name"
              PASS=$((PASS+1))
            else
              echo "✗ $name"
              FAIL=$((FAIL+1))
            fi
          done
          echo "specs: pass=$PASS fail=$FAIL"
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

  ai-review:
    name: AI PR Review (MiniMax-M3)
    needs: baseline
    runs-on: ubuntu-latest
    # 周期 9 P1-4: 接 MiniMax-M3 跑 PR review
    #   - anthropic-base-url 指向 MiniMax 平台（Anthropic-compatible API）
    #   - claude_args 强制 MiniMax-M3 模型 + max-turns 5（限 token 消耗）
    #   - secrets.M3_API_KEY: MiniMax 平台 API key（settings/secrets/actions）
    if: ${{ env.M3_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Review (claude-code-action + MiniMax-M3)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.M3_API_KEY }}
          # 周期 9 P1-4: 指向 MiniMax 平台（Anthropic-compatible API）
          anthropic_base_url: ${{ secrets.M3_BASE_URL || 'https://api.MiniMax.com/v1' }}
          # 强制使用 MiniMax-M3 模型
          claude_args: |
            --model MiniMax-M3 \
            --max-turns 5 \
            --allowedTools "Read,Grep,Glob,Bash" \
            --system-prompt "你是 Cesium GIS Editor 项目的 PR review agent。重点检查：1) 安全（SSRF / XSS / auth bypass）；2) spec 覆盖（每个新功能有 tests/specs/*.cjs）；3) commit 格式（feat/fix/chore(cycle-NN): ...）；4) 未提交 .env / 真实 key / blog.db；5) 周期 docs 在 docs/cycles/cycle-NN-*.md。"
          # 触发 PR review 的 GitHub event
          trigger_pr_review: true

      - name: Post PR comment (sticky)
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## PR Review (周期 9 P1-4: MiniMax-M3)
            - ✅ 基础健康检查通过
            - ✅ AI 评审由 MiniMax-M3 跑（claude-code-action + anthropic-base-url）
            - 评审项：security / spec coverage / commit format / cycle docs / model MiniMax-M3
            - 限制：max-turns 5 避免 token 消耗过多
